services:
  postgres:
    image: postgres:16
    container_name: polyetl_db
    environment:
      POSTGRES_USER: polyetl
      POSTGRES_PASSWORD: polyetl
      POSTGRES_DB: polyetl
    ports:
      - "5432:5432"
    volumes:
      - polyetl_pg_data:/var/lib/postgresql/data
  metabase:
    image: metabase/metabase:latest
    container_name: polyetl_metabase
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - metabase_data:/metabase-data

volumes:
  polyetl_pg_data:
  metabase_data: